name: Test and Release

on:
  workflow_dispatch:
  release:
    types:
      - published
  pull_request:
    branches:
      - master
      - v[0-9]+.[0-9]+-dev

jobs:
  test:
    name: Run Dashcore lib tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Enable NPM cache
        uses: actions/cache@v4
        with:
          path: '~/.npm'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install NPM dependencies
        run: npm ci

      - name: Run ESLinter
        run: npm run lint

      - name: Run tests
        run: npm run test

  release:
    name: Release NPM package
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'release' }}
    # npm trusted publishing: npm exchanges the job's OIDC token for a publish
    # token, so no NPM_TOKEN secret is needed
    permissions:
      contents: read
      id-token: write
    # Every step here can request an npm publish token, so only GitHub's own
    # actions run, pinned to commits, and the checks are plain shell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Trusted publishing needs npm 11.5.1 or later. No registry-url: with it,
      # setup-node writes a token entry to .npmrc and npm tries token auth
      # instead of the OIDC exchange.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.1'

      - name: Check package version matches tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version v$VERSION"
            exit 1
          fi

      # X.Y-dev for dev releases, latest otherwise
      - name: Set release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$RELEASE_TAG" == *dev* ]]; then
            [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+) ]]
            echo "result=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}-dev" >> "$GITHUB_OUTPUT"
          else
            echo "result=latest" >> "$GITHUB_OUTPUT"
          fi

      # Packs the checkout as earlier releases did: --ignore-scripts skips the
      # prepublishOnly build, and nothing is installed in this job, so no package
      # script runs while the OIDC token is available. Trusted publishing adds a
      # provenance attestation, which requires package.json's repository.url to
      # name this repository.
      - name: Publish NPM package
        env:
          NPM_TAG: ${{ steps.tag.outputs.result }}
        run: npm publish --ignore-scripts --access public --tag "$NPM_TAG"
